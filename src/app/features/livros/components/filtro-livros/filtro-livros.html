<section class="filtros">
  <label class="campo-pesquisa">
    <span class="rotulo-acessivel">Pesquisar no catálogo</span>
    <span class="icone-pesquisa" aria-hidden="true"></span>
    <input
      type="search"
      placeholder="Busque por título ou autor"
      [value]="pesquisa()"
      (input)="alterarPesquisa($event)"
    />
  </label>

  <label class="campo-status">
    <span>Status</span>
    <select [value]="status()" (change)="alterarStatus($event)">
      <option value="todos">Todos</option>
      <option value="disponivel">Disponível</option>
      <option value="emprestado">Emprestado</option>
      <option value="extraviado">Extraviado</option>
      <option value="danificado">Danificado</option>
      <option value="reservado">Reservado</option>
    </select>
  </label>
</section>
